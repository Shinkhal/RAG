[project]
name = "rag-microservice"
version = "0.1.0"
description = "NotebookLM-style RAG with persona-based responses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.45.0",  # updated
    "pydantic>=2.13.3",          # updated
    "pydantic-settings>=2.14.0", # updated
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pgvector>=0.4.0",
    "google-genai>=0.1.0",
    "cloudinary>=1.41.0",
    "boto3>=1.42.93",            # updated
    "redis>=5.0.0",
    "sentence-transformers>=3.1.0",
    "langchain-text-splitters>=0.3.0",
    "PyPDF2>=3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "tavily-python>=0.7.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N801"]  # N801: Allow lowercase nested namespace classes

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
