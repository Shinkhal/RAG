<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}RAG Workspace{% endblock %}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f7f8f4; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #172c28;">
    {% if preheader %}
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; mso-hide: all;">
      {{ preheader }}
    </div>
    {% endif %}

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f7f8f4; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px;">
            <!-- Header / Brand -->
            <tr>
              <td style="padding: 0 0 20px 4px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="background-color: #205b4d; color: #ffffff; width: 32px; height: 32px; border-radius: 8px; text-align: center; vertical-align: middle; font-size: 16px; font-weight: 700;">
                      &#9636;
                    </td>
                    <td style="padding-left: 10px; font-size: 16px; font-weight: 700; color: #172c28;">
                      RAG Workspace
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Main Card -->
            <tr>
              <td style="background-color: #ffffff; border: 1px solid #dbe3dc; border-radius: 16px; padding: 32px;">
                {% block content %}{% endblock %}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding: 20px 4px 0; font-size: 12px; line-height: 1.5; color: #536762; text-align: center;">
                <p style="margin: 0 0 4px;">RAG Workspace &middot; Private Document Intelligence</p>
                {% block footer_note %}{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
