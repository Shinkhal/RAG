<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A private document workspace for reading, asking questions, and checking sources.">
  <title>RAG Workspace</title>
  <script>
    // Apply the remembered theme before first paint to avoid a light flash.
    (function () {
      try {
        var stored = localStorage.getItem("rag-theme");
        var preference =
          stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        var dark =
          preference === "dark" ||
          (preference === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.dataset.themePreference = preference;
        root.style.colorScheme = dark ? "dark" : "light";
      } catch (error) {
        // If storage is unavailable, CSS falls back to the light theme.
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
